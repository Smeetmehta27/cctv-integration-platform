version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: vigilis_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vigilis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vigilis"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vigilis_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
